services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nestly
      POSTGRES_PASSWORD: nestly
      POSTGRES_DB: nestly
    ports:
      - "5432:5432"
    volumes:
      - nestly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nestly_pgdata:
